# Self-update: F0Store (the previous version, from our live repository) finds its own update there and installs it.
appId: tech.axi0.f0store
---
- launchApp
- extendedWaitUntil:
    visible: "axi0 picks"
    timeout: 60000
- tapOn: "Updates"
- extendedWaitUntil:
    visible:
      text: "F0Store"
      index: 1
    timeout: 900000
- takeScreenshot: 06a-self-update-listed
- tapOn:
    text: "F0Store"
    index: 1
- waitForAnimationToEnd
- tapOn: "Update"
- extendedWaitUntil:
    visible:
      id: ".*:id/button1"
    timeout: 300000
- takeScreenshot: 06b-self-update-dialog
- tapOn:
    id: ".*:id/button1"
