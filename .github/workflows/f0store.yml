# F0Store: build, sign, test on an emulator, and (on a manual run with publish) publish to our repository.
name: F0Store

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed APK to https://axi0.tech/f0store/repo
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: f0store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: The picks list in the app matches docs/picks.json
        run: python3 tools/picks.py --check
      - id: meta
        name: Version
        run: |
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build the release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Sign with the F0Store key
        env:
          P12_B64: ${{ secrets.F0STORE_APK_P12_B64 }}
          P12_PASS: ${{ secrets.F0STORE_APK_PASS }}
        run: bash tools/sign-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk "out/F0Store-${{ steps.meta.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Maestro (test driver, not shipped)
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install, sync, browse, search, install a pick, update an app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/emulator.sh out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  publish:
    needs: [build, emulator]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fdroidserver
        run: pip install --quiet fdroidserver==2.4.5
      - name: Build and sign the repository (index-v2, entry.jar, index-v1)
        env:
          REPO_P12_B64: ${{ secrets.F0STORE_REPO_P12_B64 }}
          REPO_PASS: ${{ secrets.F0STORE_REPO_PASS }}
        run: bash repo/build.sh "out/F0Store-${{ needs.build.outputs.version }}.apk" "${{ needs.build.outputs.code }}" "$RUNNER_TEMP/f0repo"
      - name: Upload to https://axi0.tech/f0store/repo/
        env:
          UPLOAD_SECRET: ${{ secrets.F0STORE_UPLOAD_SECRET }}
        run: python3 repo/upload.py "$RUNNER_TEMP/f0repo/repo"
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: ${{ runner.temp }}/f0repo/repo/
